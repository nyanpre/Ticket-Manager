name: Supabase Keep Alive

on:
  schedule:
    # 毎週 月曜・木曜 の午前 9:00 (UTC 0:00) に定期実行
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # 手動実行トリガー

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/groups?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Supabase successfully pinged!"